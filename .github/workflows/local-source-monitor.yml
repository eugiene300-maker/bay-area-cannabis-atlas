name: Check local source references
on:
  schedule:
    - cron: '17 16 * * 3'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/refresh-local.py
      - run: python3 scripts/build.py
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - run: python3 scripts/check.py
      - run: |
          git config user.name 'Local source monitor'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/local-source-status.json dist
          git diff --cached --quiet || git commit -m 'Refresh local source monitoring status'
          git push
